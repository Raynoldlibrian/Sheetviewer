
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1e2d4a;--navy2:#2c4068;--gold:#c9a84c;--s:var(--color-background-primary);--s2:var(--color-background-secondary);--s3:var(--color-background-tertiary);--t:var(--color-text-primary);--m:var(--color-text-secondary);--b:var(--color-border-tertiary);--b2:var(--color-border-secondary);--r:var(--border-radius-md);--rl:var(--border-radius-lg)}
body{font-family:var(--font-sans);background:var(--s3);color:var(--t);min-height:520px}
.topbar{background:var(--navy);color:#fff;padding:0 1.25rem;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.brand-dot{width:7px;height:7px;background:var(--gold);border-radius:50%}
.nav{display:flex;gap:3px}
.nb{background:transparent;border:none;color:rgba(255,255,255,.6);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:5px;font-family:var(--font-sans);transition:all .15s}
.nb:hover,.nb.on{background:rgba(255,255,255,.12);color:#fff}
.nb.on{color:#e8c96a}
.page{display:none;padding:1.25rem}
.page.on{display:block}

/* settings */
.sc{background:var(--s);border:0.5px solid var(--b);border-radius:var(--rl);padding:1.25rem;max-width:560px;margin:0 auto}
.sec-title{font-size:13px;font-weight:500;color:var(--m);text-transform:uppercase;letter-spacing:.6px;margin-bottom:.9rem;display:flex;align-items:center;gap:6px}
.fl{margin-bottom:1rem}
.fl-label{font-size:11.5px;font-weight:500;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block}
.fi{width:100%;padding:8px 11px;border:0.5px solid var(--b);border-radius:var(--r);background:var(--s2);color:var(--t);font-size:13.5px;font-family:var(--font-sans)}
.fi:focus{outline:none;border-color:var(--navy2)}
.hint{font-size:11px;color:var(--m);margin-top:4px;line-height:1.5}
.divider{border:none;border-top:0.5px solid var(--b);margin:1.1rem 0}
.btn-primary{background:var(--navy);color:#fff;border:none;padding:9px 18px;border-radius:var(--r);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:var(--font-sans);transition:background .15s}
.btn-primary:hover{background:var(--navy2)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-sec{background:var(--s2);color:var(--t);border:0.5px solid var(--b);padding:8px 14px;border-radius:var(--r);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans)}
.btn-sec:hover{border-color:var(--b2)}

/* sheet selector */
.sheet-row{display:flex;gap:8px;align-items:flex-end}
.sheet-row .fi{flex:1}
.select-wrap{position:relative}
.select-wrap select.fi{padding-right:28px;appearance:none;cursor:pointer}
.select-wrap::after{content:'';position:absolute;right:10px;top:50%;transform:translateY(-50%);border:4px solid transparent;border-top:5px solid var(--m);pointer-events:none}

/* kolom checklist */
.col-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.col-chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border:0.5px solid var(--b);border-radius:20px;cursor:pointer;font-size:12px;background:var(--s2);color:var(--t);user-select:none;transition:all .15s}
.col-chip:hover{border-color:var(--b2)}
.col-chip.checked{background:var(--navy);color:#fff;border-color:var(--navy)}
.col-chip input{display:none}

/* cards page */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:1.1rem;flex-wrap:wrap}
.tbar-title{font-size:14px;font-weight:500;flex:1;min-width:100px}
.sw{position:relative}
.sw .ti{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--m);pointer-events:none}
.si{padding:7px 10px 7px 30px;border:0.5px solid var(--b);border-radius:var(--r);background:var(--s2);color:var(--t);font-size:13px;font-family:var(--font-sans);width:180px}
.si:focus{outline:none}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--s);border:0.5px solid var(--b);border-radius:var(--rl);overflow:hidden;transition:border-color .15s}
.card:hover{border-color:rgba(30,45,74,.3)}
.ch{background:var(--navy);padding:11px 14px;color:#fff}
.ch-title{font-size:13.5px;font-weight:500;line-height:1.4}
.ch-sub{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:2px}
.cb{padding:11px 14px}
.ri{margin-bottom:8px;padding-bottom:8px;border-bottom:0.5px solid var(--b)}
.ri:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.rl{font-size:10px;font-weight:500;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.rv{font-size:13px;line-height:1.45;word-break:break-word}

/* states */
.sbox{text-align:center;padding:2.5rem 1rem;color:var(--m)}
.sbox .ti{font-size:28px;display:block;margin-bottom:10px;opacity:.35}
.sbox p{font-size:13px;line-height:1.6}
.al{color:var(--navy2);cursor:pointer;text-decoration:underline}
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:12.5px;display:none;z-index:99;white-space:nowrap}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--navy);color:#fff;border-radius:50%;font-size:11px;font-weight:500;margin-right:6px;flex-shrink:0}
.step-row{display:flex;align-items:center;margin-bottom:.85rem}
</style>

<div class="topbar">
  <div class="brand"><div class="brand-dot"></div>SheetView</div>
  <div class="nav">
    <button class="nb" id="nb-cards" onclick="showPage('cards')"><i class="ti ti-layout-cards" aria-hidden="true"></i> Data</button>
    <button class="nb on" id="nb-settings" onclick="showPage('settings')"><i class="ti ti-settings" aria-hidden="true"></i> Setelan</button>
  </div>
</div>

<div id="page-settings" class="page on">
  <div class="sc">

    <div class="step-row">
      <span class="step-badge">1</span>
      <span class="sec-title" style="margin:0"><i class="ti ti-key" aria-hidden="true"></i> API Key</span>
    </div>
    <div class="fl">
      <label class="fl-label">Google Sheets API Key</label>
      <input class="fi" id="in-key" type="password" placeholder="AIza..." />
      <p class="hint">Satu API Key berlaku untuk semua spreadsheet publik.</p>
    </div>

    <div class="divider"></div>

    <div class="step-row">
      <span class="step-badge">2</span>
      <span class="sec-title" style="margin:0"><i class="ti ti-table" aria-hidden="true"></i> Spreadsheet</span>
    </div>
    <div class="fl">
      <label class="fl-label">URL atau ID Spreadsheet</label>
      <div class="sheet-row">
        <input class="fi" id="in-ss" type="text" placeholder="https://docs.google.com/spreadsheets/d/..." />
        <button class="btn-sec" onclick="fetchSheets()" id="btn-fetch">
          <i class="ti ti-refresh" aria-hidden="true"></i> Ambil sheet
        </button>
      </div>
      <p class="hint">Spreadsheet harus di-share "Anyone with the link can view".</p>
    </div>

    <div class="fl" id="fl-sheet" style="display:none">
      <label class="fl-label">Pilih sheet</label>
      <div class="select-wrap">
        <select class="fi" id="in-sheet" onchange="fetchHeaders()"></select>
      </div>
    </div>

    <div class="fl" id="fl-cols" style="display:none">
      <label class="fl-label">Tampilkan kolom</label>
      <p class="hint" style="margin-bottom:6px">Klik untuk centang/hapus centang. Kolom pertama selalu jadi judul kartu.</p>
      <div class="col-grid" id="col-grid"></div>
    </div>

    <div class="divider" id="div-save" style="display:none"></div>
    <div id="wrap-save" style="display:none;gap:10px;align-items:center">
      <button class="btn-primary" onclick="saveAndLoad()">
        <i class="ti ti-device-floppy" aria-hidden="true"></i> Simpan & tampilkan
      </button>
    </div>

  </div>
</div>

<div id="page-cards" class="page">
  <div class="toolbar">
    <span class="tbar-title" id="tbar-title">Data</span>
    <div class="sw">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input class="si" id="si" type="text" placeholder="Cari..." oninput="filterCards()" />
    </div>
    <button class="btn-sec" onclick="loadData()"><i class="ti ti-refresh" aria-hidden="true"></i> Muat ulang</button>
  </div>
  <div id="card-grid" class="card-grid"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const LS={get:k=>localStorage.getItem('sv_'+k)||'',set:(k,v)=>localStorage.setItem('sv_'+k,v)};
let allRows=[],headers=[],visibleCols=[];

function extractId(s){
  s=s.trim();
  const m=s.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return m?m[1]:s;
}

window.onload=function(){
  document.getElementById('in-key').value=LS.get('key');
  document.getElementById('in-ss').value=LS.get('ss');
  const ssId=extractId(LS.get('ss'));
  if(ssId&&LS.get('key')&&LS.get('sheet')){
    restoreSheetSelect();
  }
};

async function restoreSheetSelect(){
  await fetchSheets(true);
  const saved=LS.get('sheet');
  const sel=document.getElementById('in-sheet');
  if(saved)sel.value=saved;
  await fetchHeaders(true);
  const savedCols=LS.get('cols');
  if(savedCols){
    visibleCols=JSON.parse(savedCols);
    renderColChips(headers,visibleCols);
  }
  document.getElementById('div-save').style.display='';
  document.getElementById('wrap-save').style.display='flex';
  showPage('cards');
  loadData();
}

async function fetchSheets(silent=false){
  const key=document.getElementById('in-key').value.trim();
  const ssId=extractId(document.getElementById('in-ss').value);
  if(!key||!ssId){showToast('Isi API Key dan URL/ID spreadsheet dulu.');return;}
  const btn=document.getElementById('btn-fetch');
  btn.disabled=true;
  btn.innerHTML='<i class="ti ti-loader-2"></i> Mengambil...';
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ssId}?fields=sheets.properties.title&key=${key}`);
    const d=await r.json();
    if(d.error){showToast('Error: '+d.error.message);return;}
    const sheets=d.sheets.map(s=>s.properties.title);
    const sel=document.getElementById('in-sheet');
    sel.innerHTML=sheets.map(s=>`<option value="${s}">${s}</option>`).join('');
    document.getElementById('fl-sheet').style.display='';
    if(!silent)showToast(sheets.length+' sheet ditemukan.');
    LS.set('ss',document.getElementById('in-ss').value.trim());
    LS.set('key',key);
    await fetchHeaders(silent);
  }catch(e){showToast('Gagal: '+e.message);}
  btn.disabled=false;
  btn.innerHTML='<i class="ti ti-refresh"></i> Ambil sheet';
}

async function fetchHeaders(silent=false){
  const key=LS.get('key')||document.getElementById('in-key').value.trim();
  const ssId=extractId(LS.get('ss')||document.getElementById('in-ss').value);
  const sheet=document.getElementById('in-sheet').value;
  if(!key||!ssId||!sheet)return;
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ssId}/values/${encodeURIComponent(sheet)}!1:1?key=${key}`);
    const d=await r.json();
    if(d.error){showToast('Error: '+d.error.message);return;}
    headers=(d.values&&d.values[0])||[];
    visibleCols=headers.map((_,i)=>i);
    renderColChips(headers,visibleCols);
    document.getElementById('fl-cols').style.display='';
    document.getElementById('div-save').style.display='';
    document.getElementById('wrap-save').style.display='flex';
    LS.set('sheet',sheet);
  }catch(e){if(!silent)showToast('Gagal ambil header: '+e.message);}
}

function renderColChips(hdrs,checked){
  const grid=document.getElementById('col-grid');
  grid.innerHTML=hdrs.map((h,i)=>{
    const isChecked=checked.includes(i);
    const isFirst=i===0;
    return `<label class="col-chip ${isChecked?'checked':''}" data-i="${i}">
      <input type="checkbox" ${isChecked?'checked':''} ${isFirst?'disabled':''} onchange="toggleCol(${i},this)" />
      ${isFirst?'<i class="ti ti-crown" style="font-size:11px" aria-hidden="true"></i>':''} ${h||'Kolom '+(i+1)}
    </label>`;
  }).join('');
}

function toggleCol(i,cb){
  const chip=cb.closest('.col-chip');
  if(cb.checked){if(!visibleCols.includes(i))visibleCols.push(i);chip.classList.add('checked');}
  else{visibleCols=visibleCols.filter(c=>c!==i);chip.classList.remove('checked');}
  visibleCols.sort((a,b)=>a-b);
}

function saveAndLoad(){
  LS.set('key',document.getElementById('in-key').value.trim());
  LS.set('ss',document.getElementById('in-ss').value.trim());
  LS.set('sheet',document.getElementById('in-sheet').value);
  LS.set('cols',JSON.stringify(visibleCols));
  showPage('cards');
  loadData();
}

async function loadData(){
  const grid=document.getElementById('card-grid');
  grid.innerHTML='<div class="sbox"><i class="ti ti-loader-2"></i><p>Memuat data...</p></div>';
  const key=LS.get('key');
  const ssId=extractId(LS.get('ss'));
  const sheet=LS.get('sheet');
  if(!key||!ssId||!sheet){
    grid.innerHTML=`<div class="sbox"><i class="ti ti-settings"></i><p>Belum ada setelan.<br><span class="al" onclick="showPage('settings')">Buka Setelan</span> dulu.</p></div>`;
    return;
  }
  const savedCols=LS.get('cols');
  if(savedCols)visibleCols=JSON.parse(savedCols);
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${ssId}/values/${encodeURIComponent(sheet)}?key=${key}`);
    const d=await r.json();
    if(d.error){grid.innerHTML=`<div class="sbox"><i class="ti ti-x"></i><p>Error: ${d.error.message}</p></div>`;return;}
    const rows=d.values||[];
    if(rows.length<2){grid.innerHTML='<div class="sbox"><i class="ti ti-table-off"></i><p>Sheet kosong.</p></div>';return;}
    headers=rows[0];
    allRows=rows.slice(1).filter(row=>row.some(c=>String(c).trim()!==''));
    document.getElementById('tbar-title').innerHTML=`${sheet} <span style="font-size:12px;color:var(--m);font-weight:400">(${allRows.length} baris)</span>`;
    renderCards(allRows);
    showToast(allRows.length+' baris dimuat.');
  }catch(e){grid.innerHTML=`<div class="sbox"><i class="ti ti-wifi-off"></i><p>Gagal: ${e.message}</p></div>`;}
}

function renderCards(rows){
  const grid=document.getElementById('card-grid');
  const cols=visibleCols.length?visibleCols:headers.map((_,i)=>i);
  if(!rows.length){grid.innerHTML='<div class="sbox"><i class="ti ti-search-off"></i><p>Tidak ada hasil.</p></div>';return;}
  grid.innerHTML=rows.map((row,ri)=>{
    const titleIdx=cols[0];
    const title=row[titleIdx]||`Baris ${ri+1}`;
    const sub=headers[titleIdx]||'';
    let body='';
    for(let k=1;k<cols.length;k++){
      const i=cols[k];
      const val=row[i]!==undefined?String(row[i]).trim():'';
      if(val!==''){
        body+=`<div class="ri"><div class="rl">${headers[i]||'Kolom '+(i+1)}</div><div class="rv">${val}</div></div>`;
      }
    }
    return `<div class="card"><div class="ch"><div class="ch-title">${title}</div><div class="ch-sub">${sub}</div></div><div class="cb">${body||'<span style="font-size:12px;color:var(--m)">—</span>'}</div></div>`;
  }).join('');
}

function filterCards(){
  const q=document.getElementById('si').value.toLowerCase();
  if(!q){renderCards(allRows);return;}
  renderCards(allRows.filter(r=>r.some(c=>String(c).toLowerCase().includes(q))));
}

function showPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(el=>el.classList.remove('on'));
  document.getElementById('page-'+p).classList.add('on');
  document.getElementById('nb-'+p).classList.add('on');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}
</script>
